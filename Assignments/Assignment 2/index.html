<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Activity Monitor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Student Activity Monitor</h1>
        
        <div class="button-group">
            <button id="login-btn">Login</button>
            <button id="assignment-btn">Submit Assignment</button>
            <button id="logout-btn">Logout</button>
            <button id="exit-btn">Exit App</button>
        </div>

        <h3>Activity Log:</h3>
        <div id="log-box">
            <p class="log-placeholder">Waiting for student activity...</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
