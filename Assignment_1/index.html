<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz</title>
</head>
<body>
    <h1>Quiz Application </h1>
    <form id="userForm">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required><br><br>

        <label for="roll">Roll Number:</label>
        <input type="text" id="roll" name="roll" required><br><br>

        <label for="class">Class/Section:</label>
        <input type="text" id="class" name="class" required><br><br>

        <button type="submit">Start Quiz</button>
    </form>

    <p> Q1. What is the capital of France? </p>
    <form id="questionForm">
        <input type="radio" id="paris" name="capital" value="Paris" required>
        <label for="paris">Paris</label><br>

        <input type="radio" id="london" name="capital" value="London">
        <label for="london">London</label><br>

        <input type="radio" id="berlin" name="capital" value="Berlin">
        <label for="berlin">Berlin</label><br>

        <input type="radio" id="madrid" name="capital" value="Madrid">
        <label for="madrid">Madrid</label><br><br>

        <button type="submit">Next</button>
    </form>

    <p> Q2. What is 2 + 2? </p>
    <form id="questionForm2">
        <input type="radio" id="3" name="math" value="3" required>
        <label for="3">3</label><br>

        <input type="radio" id="4" name="math" value="4">
        <label for="4">4</label><br>

        <input type="radio" id="5" name="math" value="5">
        <label for="5">5</label><br>

        <input type="radio" id="6" name="math" value="6">
        <label for="6">6</label><br><br>

        <button type="submit">Next</button>
    </form>

    <p> Q3. What is the largest planet in our solar system? </p>
    



    
    










    
</body>
</html>
